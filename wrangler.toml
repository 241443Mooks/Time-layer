# Cloudflare Worker serves the evidence API alongside the existing static site.
# The map UI still loads as static assets; only /api/* invokes the Worker first.
name = "time-layer"
compatibility_date = "2026-11-04"
main = "./src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]
